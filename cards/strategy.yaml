  - id: STRAT-002
    title: 结论随提问语气/框架漂移（鼓励与质疑两问结果不同）
    description: "正向 AI 回应系统性夸大用户对内容的效度感知——哪怕内容是虚构的预测（Personal Validation Effect, CHI'26）；GPT-4 对自己参与的方案过度乐观，换「评估他人方案的旁观者」或「撰写反对意见」框架后偏差消失（SSRN 工作论文，B 级）。落到使用侧：同一问题用鼓励性 vs 质疑性语气问，结论随语气漂移的建议不可作为决策输入。与 RD-018 互证：推理链挡不住语气带入（谄媚时推理前后不一致）。"
    symptom: 换个问法/语气结论就变；先说「我觉得挺好」再问，得到的全是支持意见；没人做过同题双语气对照
    severity:
      S: 5
      O: 7
      D: 7
    evidence:
      source: >-
        Personal Validation Effect in LLMs（CHI '26，ACM DOI 10.1145/3772318.3791851，直达验真）+ LLM-optimists（SSRN
        5012083 未同行评审，机制旁证）+ RD-018（ACL 2026，谄媚时推理前后不一致——同一现象的推理层证据）
      level: empirical
    fix: "关键建议过语气 A/B：同题分别用鼓励性与质疑性语气各问一次，结论不一致即弃用；需要乐观评估时显式换「旁观者评审他人方案」框架"
    verifier: "同题双语气对照——结论漂移即命中；不漂移可进入后续验证流程（不等于正确）"
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 换个问法
      - 再问一遍
      - 双问
      - 先夸后问
      - 我觉得挺好你觉得呢
      - 引导性提问
      - rephrase
      - ask again
      - framing
    hazard_type: 常见错误
