  - id: RD-016
    title: 无外部反馈的自我纠正不升反降（「再检查一遍」是伪动作）
    description: "推理任务上，LLM 仅凭内在能力自我纠正（不借助外部反馈）效果不升反降。Self-Refine 报告的自提升中有一部分可归因于「改得更长更好看」而非更对。让模型「自己再想想」不产生新信息——公理 2「内省不算验证」的直接实证。"
    symptom: 用「让 AI 再检查一遍自己的答案」「自查自纠」作为验证手段；连续追问后模型改口即信
    severity:
