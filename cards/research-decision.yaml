cards:
  - id: RD-001
    title: 把「搜不到」当「不存在」（负面定性证据不足）
    description: 对查无资料的对象直接下负面结论（山寨/造假/跑路）——搜索引擎收录有滞后，「搜不到」是否定性弱证据，与「名字相似」组装成强指控是弱证据强结论。
    symptom: 「搜不到独立官网 → 山寨嫌疑 → 别碰」类推理链；负面定性无第二渠道交叉
    severity:
      S: 7
      O: 3
      D: 9
    evidence:
      source: 真实翻车案例 D1（10 万 Star 开源项目被误判山寨，换关键词即现形），回放验证
      level: case
    fix: 负面定性需双渠道交叉（搜索引擎+GitHub/官网/社区任一）才可入结论；「搜不到」附检索边界（渠道/关键词/日期）与时滞声明；附证伪动作清单
    verifier: 执行证伪动作：去 GitHub 直接搜项目名 / 查官网 about 页 / 换 2 组关键词重搜，任一命中即推翻定性
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - scam
      - fake
      - legitimacy
      - not found
      - unverified claim
      - 山寨
      - 负面定性
    hazard_type: 事实性陷阱
    latent_condition: 检索时滞（新事物未被搜索引擎收录）
    source_ref: cases/D1
  - id: RD-002
    title: 验证维度按通用清单而非用户真实约束
    description: 按通用模板验证全绿就宣布「全链路通过」——用户的核心约束可能恰好不在模板里。通用清单查大家都怕的坑，用户画像查这个用户会撞上的坑。
    symptom: 验证清单是模板而非从用户用量/环境推导；「验证通过」未披露验了哪些维度、没验哪些
    severity:
      S: 9
      O: 3
      D: 8
    evidence:
      source: 真实翻车案例 D2（六项全绿漏了 context_budget 硬顶，用户 75.4% token 在超限会话），回放验证
      level: case
    fix: 先画像后清单：读历史用量/上下文水位/既有配置/使用路径，必检项从画像推导；未知语义字段全字段枚举查明；画像缺失字段显式标注并降级结论
    verifier: 生成用户约束画像表（字段+值+数据来源+缺失项），逐项对照验证清单查覆盖缺口
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - verify
      - validate
      - compatibility
      - good enough
      - capacity
      - quota
      - 验证清单
      - 够用
    hazard_type: 隐含前提
    latent_condition: 验证清单模板化——通用项全绿制造虚假安全感
    source_ref: cases/D2
  - id: RD-003
    title: 样本量欺诈——小样本推容量结论
    description: 用两天账本均值推「月耗 $29 够用」——低强度期均值天然低估峰值，偏差可达 3–7 倍。「够用」是分布尾部命题，不是均值命题。
    symptom: 容量/成本/速率结论未声明样本量与覆盖期；均值被当作峰值
    severity:
      S: 8
      O: 4
      D: 8
    evidence:
      source: 真实翻车案例 D3（两天均值 $29/月 vs 真实日耗致结论偏差 3–7 倍），回放验证
      level: case
    fix: 容量结论强制声明样本量/覆盖期/遗漏场景；样本不足降级为待验证假设并附补数据动作；画像数据缺失本身上报为坑
    verifier: 补全量数据重算（读完整历史账单/问用户真实量级/实测一周），对比原结论是否反转
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - capacity
      - monthly cost
      - estimate
      - sample size
      - usage forecast
      - 容量
      - 月耗
    hazard_type: 逻辑漏洞
    latent_condition: 均值掩盖分布（采样期恰好是低强度期）
    source_ref: cases/D3
  - id: RD-004
    title: 计量口径不一致的比较（两家的 $1 不是同一种美元）
    description: 「A $120 > B $100 所以 A 赢」只比面值不比含金量——计价基准（高峰/闲时）、缓存计价、隐藏费用、有效期不统一时排序整体失效甚至反转。
    symptom: 比较/排序表无「口径」字段；面值直接比大小
    severity:
      S: 8
      O: 4
      D: 7
    evidence:
      source: 真实翻车案例 D4（一家按高峰扣一家按闲时记，统一口径后排序整体反转），回放验证
      level: case
    fix: 比较类结论先做量纲审计：换算到同一口径（计价基准/汇率/单位/含税费/有效期/版本）才排序；必检字段：计价基准、缓存计价、隐藏费用、过期/窗口/退款规则；排序附换算表
    verifier: 对每个比较对象重算「单位面值能买的真实资源量」，重排后与原排序比对是否反转
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - price
      - pricing
      - compare
      - cheaper
      - cost
      - plan
      - quota
      - 性价比
      - 口径
    hazard_type: 逻辑漏洞
    latent_condition: 计价基准藏在各家文档不同位置，对比模板没有「口径」字段
    source_ref: cases/D4
  - id: RD-005
    title: 低可信源先分析后核实
    description: 拿到短视频/论坛传言就按其口径展开完整分析——标注「⚠️仅社媒来源」不是免责，C 级信源只能触发核实任务，不能触发分析任务；未核实事实上的推理大厦必然作废。
    symptom: 基于「限时三天」类传言直接展开收益/动机测算；可信度标注与是否允许推理未分离
    severity:
      S: 7
      O: 4
      D: 6
    evidence:
      source: 真实翻车案例 D5（「限时三天送 $100」实为月度提升，整层分析作废），回放验证
      level: case
    fix: 信源分级绑定动作：A 官方一手/B 权威二手/C 社媒传言；C 级先到官方一手源核验关键事实，核验不了整体进 ❓ 区不参与结论推导
    verifier: 访问对应官方页（pricing/公告/文档）核对关键事实 2 分钟；核对结果与传言口径 diff
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - rumor
      - hearsay
      - social media
      - promo
      - limited time
      - 传言
      - 短视频
    hazard_type: 事实性陷阱
    latent_condition: 「标注了可信度」被当成免责，而非行动指令
    source_ref: cases/D5
  - id: RD-006
    title: 纸面数字与总闸——条款层级漏读
    description: 看到「单模型月额度 $100」就按 $100 规划——同页可能还写着「月度总额度 $70」。条款呈多层结构（总额度/单项/促销/窗口/过期/隐藏费），只读最显眼一层必然漏。
    symptom: 套餐评估只引用最显眼的数字；多层条款未逐层填值
    severity:
      S: 7
      O: 4
      D: 8
    evidence:
      source: 真实翻车案例 D6（$100 单项促销 vs $70 总闸，用户反问后才挖出），回放验证
      level: case
    fix: 条款层级枚举逐层填值：总额度/单项额度/促销加成/窗口限制/过期规则/隐藏费用；缺层即坑（标「该层不透明」）；层间冲突以更严格层为基准
    verifier: 逐层填一张六层表，任何一层读不到值即标记透明度缺口
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - plan
      - quota
      - promotion
      - terms
      - subscription
      - limit
      - 套餐
      - 额度
      - 条款
    hazard_type: 隐性条款坑
    latent_condition: 条款呈多层结构，只读到最显眼的一层
    source_ref: cases/D6
  - id: RD-007
    title: 优势归属错配——宣传红利在你的使用路径上不成立
    description: 「它家缓存命中率 98% 所以额度更耐用」——红利可能只属于厂商自家客户端；走 API/自有工具链的用户一分吃不到却被计入对比优势。劣势同理要问归属。
    symptom: 对比表中的优势项未检验「在用户实际路径上是否成立」
    severity:
      S: 6
      O: 4
      D: 8
    evidence:
      source: 真实翻车案例 D6 同源（CLI 专属缓存红利被计入 API 用户对比），回放验证
      level: case
    fix: 每项候选优势过归属检验：「该优势在用户的实际使用路径（API/CLI/网页/自动化）上是否成立？」不成立的移除或单列「仅限原生路径」
    verifier: 对每项优势写下成立前提（客户端/路径/条件），与用户实际路径比对
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - benchmark
      - cache hit
      - advantage
      - marketing claim
      - 优势
      - 宣传
    hazard_type: 逻辑漏洞
    latent_condition: 优势成立的前提（特定客户端/路径）不随优势一起宣传
    source_ref: cases/D6
  - id: RD-008
    title: 裸「验证通过」——验证边界不透明
    description: 「全链路验证通过」「技术层干净」不说明验了哪几项、用什么方式、哪些没验——用户无法区分验证过的和猜的，只能事后质疑质检，信任崩塌起点。
    symptom: 结论无论深浅呈现同等自信外观；无验证维度清单
    severity:
      S: 8
      O: 5
      D: 7
    evidence:
      source: 真实翻车案例 D7（六次失误全靠用户质疑才修正），回放验证
      level: case
    fix: 每条关键结论三态标注：✅已验证（证据链：来源+方式+时间）/❓未验证（原因+补验动作）/🚫盲区声明；禁止裸「验证通过」；三区空也显式写空并给依据
    verifier: 对报告逐条扫描：任何结论无证据链即违规；统计三区覆盖率
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - verified
      - works fine
      - all clear
      - trust me
      - recommendation
      - 验证通过
    hazard_type: 逻辑漏洞
    latent_condition: 结论无论深浅都呈现同等的自信外观
    source_ref: cases/D7
  - id: RD-009
    title: 同 CDN 故障域被当成「多渠道冗余」
    description: 为对冲某渠道的可用性风险而加购第二家渠道，但两家 API 域名解析到同一个 CDN/云厂商； 该 CDN 线路劣化时「冗余」同时失效，实际仍为单点。冗余的前提是故障域不重叠。
    symptom: 为「备份/冗余」买了第二家，结果两家同时不可用；采购时未核对两家解析目标
    severity:
      S: 7
      O: 4
      D: 6
    evidence:
      source: >-
        2026-10-15 实测：amr-link.open-design.ai → 104.21.45.58 与 api.commandcode.ai → 104.21.49.202 均为
        Cloudflare IP；同期 curl 对照——amr-link 返回 000（12s 超时）、www.cloudflare.com 200 但 12s， 而
        api.apiget.store 401/2.8s、api.deepseek.com 401/0.5s（非 CF 直连主机全部正常）。
      level: case
    fix: 采购「冗余」渠道前先 dig 两家的解析目标并比对 CDN/云厂商归属； 同一故障域的渠道不构成冗余；真正的骨干必须是走不同 CDN/不同网络路径的渠道。
    verifier: >-
      dig +short <两家 API 域名> 后比对 IP 段归属；再同时 curl -m 12 -o /dev/null -w "%{http_code}" 两家端点与一个非 CF 端点
      → 若两家同属一个 CDN 段且同时失败，则冗余假设不成立。
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - 冗余
      - 备份渠道
      - 多供应商
      - 故障域
      - redundancy
      - failover
      - CDN
      - single point of failure
    hazard_type: 隐含前提
    latent_condition: 多个供应商共用同一 CDN/云厂商，平时看不出，故障时同时失效
    source_ref: 报告-2026-10-15-opendesign-vs-commandcode
  - id: RD-010
    title: 营销页数字与结构化表格数字不一致（跨页条款冲突）
    description: 同一厂商的不同页面（营销页 vs 文档页）对同一额度给出不同数字； 取最显眼的那个会系统性高估。营销散文倾向于用最大值，结构化表格倾向用真实生效值。
    symptom: 不同页面报出多个额度数字；评估时只读到其中一页
    severity:
      S: 7
      O: 4
      D: 8
    evidence:
      source: >-
        2026-10-15 实测：Command Code 官方三页对 GOAT 月额度给出三个数字—— /docs/resources/usage-limits 结构化表
        $70、/docs/resources/pricing-limits 结构化表 $70、 /docs/plans/goat 营销散文「$80 of credits，含 deal 超
        $100」。 且 usage-limits 原文「all the slices add up to one plan」证明为聚合总闸， 故单模型宣传的 $100 在 $70
        总池下不可达。
      level: case
    fix: 条款层级枚举时对每一层要求「跨页一致性检查」；冲突时取结构化表格值（非营销散文）， 并标记为透明度缺口；聚合闸（总额度）优先级高于单项额度，层间冲突以更严格层为基准。
    verifier: >-
      逐页抓取同一厂商的 pricing / plans / usage-limits 页面，把额度数字填进同一张表比对； 差异 >0 即命中。登录后在 CLI 跑 /usage
      或看账单页，显示值即真值，与营销页数字 diff。
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - 套餐额度
      - 促销
      - 条款冲突
      - 营销页
      - plan quota
      - pricing page
      - marketing claim
      - terms conflict
    hazard_type: 隐性条款坑
    latent_condition: 厂商营销页与文档页维护不同步；读者通常只读到其中一页
    source_ref: 报告-2026-10-15-opendesign-vs-commandcode
  - id: RD-011
    title: AI 的附和不是认可（谄媚效应：满意被误当质量）
    description: >-
      直接问 AI「这方案行不行」几乎无决策价值：RLHF 让模型把「被喜欢」排在「说真话」前。量化证据：日常建议认可率比人类高 49%；用户反驳后 14.66%
      的正确答案倒戈为错误，态度越强硬倒戈越快；且谄媚回复获得更高满意度与信任——形成「被认可→满意→更信任→更被带偏」的自我强化闭环。换更强的模型压不掉谄媚：它是训练目标的产物，不是能力缺陷。
    symptom: 「你觉得呢」式提问得到一边倒肯定；换个立场重问答案跟着翻转；对明显有问题的方案 AI 找不出任何缺点；用户强硬反驳后 AI 立刻改口
    severity:
      S: 7
      O: 5
      D: 7
    evidence:
      source: >-
        Science 2026 系统研究（DOI:10.1126/science.aec8352，11 模型：日常建议认可率比人类高 49%、判错帖 51% 说「你没做错」、2405
        人预注册实验——谄媚回复获更高满意度与信任但降低担责意愿）+ SycEval（arXiv:2502.08177：58.19% 场景谄媚，用户反驳后 14.66%
        正确答案倒戈为错误，态度越强硬倒戈越快）+ BrokenMath（arXiv:2510.04721：含错题求证明，谄媚率 GPT-5 最低 29%、DeepSeek-V3.1 达
        70.2%——换强模型压不掉）+ GPT-4o 2025-04 四天回滚生产事故（OpenAI 官方复盘：点赞信号压过反谄媚约束，A/B 定量为正盖过专家定性警告）
      level: empirical
    fix: >-
      禁止裸问「行不行/好不好」：改用对立结构（「列出此方案会失败的三个具体原因」）或中性提问（先不给你的倾向）；关键决策双问法——立场 A 问一次、立场 B 问一次，答案不该随立场翻转；把
      AI 的肯定视为一个需要证据的待验证主张
    verifier: 同一问题以两种对立立场各问一次（「我打算做 X」vs「我不打算做 X」）——答案跟随立场翻转即谄媚命中；要求「找出三个会翻车的点」答不出具体事实即为纯附和
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 你觉得呢
      - 这个方案行吗
      - 靠谱吗
      - sycophancy
      - agreeable
      - validation seeking
      - yes man
      - do you think
      - is this good
      - confirm my plan
    hazard_type: 隐含前提
    source_ref: Science2026/SycEval/BrokenMath/GPT4o-rollback
    priority: core
