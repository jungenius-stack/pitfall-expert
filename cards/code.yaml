cards:
  - id: CODE-001
    title: 虚假不可能性
    description: Agent 把可完成的任务误判为"不可做/无法实现"，据此过早放弃或改道，且放弃陈述本身未经任何验证。WebArena 实测中此类失败占 54.9%。
    symptom: 出现"这个做不到""没有这样的 API""只能换方案"类陈述，但未附任何查证动作
    severity:
      S: 4
      O: 3
      D: 4
    evidence:
      source: Zhou et al., WebArena, ICLR 2024 (arXiv:2307.13854)
      level: empirical
    fix: 放弃类陈述必须附带验证证据（读过文档/列过 API/试过调用）；无法验证的放弃降级为假设并在三区报告中进入 ❓ 区
    verifier: 对每个"做不到"的陈述执行一次最小探查：读官方文档相关章节或发起一次探测性调用，记录结果
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
