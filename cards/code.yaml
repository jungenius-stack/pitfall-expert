      level: consensus
    fix: 相等用容差比较；金额用整数最小单位或 decimal 类型；大累加考虑 Kahan 求和或排序累加
    verifier: 容差断言 + 已知病态算式用例（0.1+0.2、1e16+1、大数吃小数序列）
