  - id: CODE-011
    title: 浮点与数值精度
    description: 0.1+0.2≠0.3、大数吃小数、灾难性抵消、NaN≠NaN、累加顺序敏感——浮点相等比较是错的，金额/科学计算用 float 直接累加是错的。
    symptom: 相等比较用 ==；金额计算出现分毫误差；同算式换顺序结果不同
