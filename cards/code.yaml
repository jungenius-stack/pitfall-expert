cards:
  - id: CODE-001
    title: 虚假不可能性
    description: Agent 把可完成的任务误判为"不可做/无法实现"，据此过早放弃或改道，且放弃陈述本身未经任何验证。WebArena 实测中此类失败占 54.9%。
    symptom: 出现"这个做不到""没有这样的 API""只能换方案"类陈述，但未附任何查证动作
    severity:
      S: 4
      O: 3
      D: 4
    evidence:
      source: Zhou et al., WebArena, ICLR 2024 (arXiv:2307.13854)
      level: empirical
    fix: 放弃类陈述必须附带验证证据（读过文档/列过 API/试过调用）；无法验证的放弃降级为假设并在三区报告中进入 ❓ 区
    verifier: 对每个"做不到"的陈述执行一次最小探查：读官方文档相关章节或发起一次探测性调用，记录结果
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 方案选型
      - API能力判断
      - 不支持类陈述
      - 技术可行性结论
      - feasibility
      - impossible
      - unsupported
      - no such api
      - cannot be done
  - id: CODE-002
    title: 幻觉式完成
    description: 宣称任务完成但环境状态未变或不符合预期——文件不存在/内容为空/数据库值未更新/外部系统无预期响应。MAST 将其归为"未经验证的终止"。
    symptom: 出现"已完成""应该可以了"类陈述但无状态证据；输出物缺失或内容不符
    severity:
      S: 5
      O: 3
      D: 3
    evidence:
      source: MAST, Cemri et al., NeurIPS 2025 (arXiv:2503.13657); τ-bench ICLR 2025
      level: empirical
    fix: 完成声明必须附环境状态证据：文件存在性+内容抽样、数据库查询结果、外部 API 响应；无证据的完成声明不予采信
    verifier: 任务结束后运行状态断言脚本，逐项比对"预期状态 vs 实际状态"，输出差异清单
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 任务收尾
      - 已完成类声明
      - 交付物生成
      - 多步长任务终点
      - task complete
      - done statement
      - delivery claim
      - finished
  - id: CODE-003
    title: 复跑不一致（方差陷阱）
    description: 单次成功掩盖高方差——同一任务多次运行结果漂移。τ-bench 实测：SOTA function-calling agent 单次成功率约 60%，八次全对（pass^8）低于 25%。
    symptom: 将"刚才明明可以"当作稳定性证据；一次性 demo 通过即宣告可靠
    severity:
      S: 4
      O: 4
      D: 4
    evidence:
      source: τ-bench, Yao et al., ICLR 2025 (arXiv:2406.12045)
      level: empirical
    fix: 关键任务设计复跑比对（≥3 次），报告一致性与方差而非单次结果；不可复跑任务显式声明为不可验证项
    verifier: 同输入连跑 N 次，对输出做结构化 diff 比对，统计一致率
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 可靠性宣称
      - 生产就绪评估
      - 演示通过后上线
      - 随机性涉及的任务
      - flaky
