  - id: CODE-024
    title: 校验层限制与实际服务限制不一致（通过校验 ≠ 能跑）
    description: 网关用「标称上下文」做前置参数校验，后端用「实际（更小）上下文」做服务限制，两个数字不同； 且报错文本指向错误的对象，误导排查方向。表现为「参数校验通过但在服务端被拒」的错位。
    symptom: 某组合通过校验却被后端拒绝；报错把 A 参数的问题说成 B 参数过长
    severity:
      S: 6
      O: 2
      D: 9
    evidence:
      source: >-
        2026-10-15 实测（apiget / gpt-6-astra），12 个数据点，规则自相矛盾、无法用任何简单公式解释： (a) prompt 仅 "hi" +
        max_tokens=999990 → 200 通过；+1000000 → 400 拒绝（报错文本为 "prompt is too long: input exceeds the
        maximum context length"，而 prompt 只有 2 个字符）。 (b) prompt=45321 tok + max_tokens=830000（和
        875321）→ 通过；+840000（和 885321）→ 拒绝； +872000 → 拒绝。→ 和值不是判据（小 prompt 的和可达 999998 却通过）。 (c)
        prompt=553750 tok + max_tokens=60 → 通过；prompt=876739 + max_tokens=60 → 拒绝，
        此时报错才给出具体数字（"876739 tokens > 872000 maximum context length"）——与 (a)(b) 的 无数字报错属于不同校验路径。
        结论：网关对 max_tokens 的校验非单调、与 prompt 长度不构成简单线性关系，疑为网关缺陷； 真实可服务的 prompt 上限为 872000（路径 c 明确给出）。
      level: case
    fix: >-
      上下文与输出参数一律以「实测能跑通的最大值」为准，不采信校验通过； 配置值向下取整留余量；max_tokens 一律填小值（≤32000 最安全）——因为该参数既不生效， 填大反而在大
