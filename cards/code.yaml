      - pass@k
  - id: CODE-004
    title: 测试通过 ≠ 正确
    description: 弱测试套件给出虚高通过率。SWE-bench 实证：7.8% "通过"的 patch 实际错误，29.6% 与 ground truth 行为分歧——测试全绿不代表修复正确。
    symptom: 测试全绿即宣布修复；断言只检查"不抛异常"不检查行为值；边界输入不在测试集
    severity:
      S: 5
      O: 3
      D: 5
    evidence:
      source: >-
        Wang et al., ICSE 2026 (arXiv:2503.15223)；现场实证（2025-2026）：r/ClaudeCode「2k tests passed
        客户发现主流程已坏」+ Medium「46,000 tests passed, one query broke it」；假绿三形态（CSDN 复盘）：断言恒真（toBe(true) 且
        result 恒 true）/ mock 掉被测逻辑测替身 / 覆盖率 80% 线上照样出 bug——AI 生成测试的目标是「看起来完整」而非「能抓 bug」
      level: empirical
    fix: 断言行为值与边界值；新测试先红后绿；把"测试是否可靠"本身列入审查
    verifier: 审查测试断言强度（是否断言行为）+ 对已知边界/对抗输入跑一遍，观察是否暴露空洞
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 修复完成声明
      - 测试全绿
      - CI 通过
      - 回归验证
      - tests pass
      - all green
      - unit test
      - ci pass
      - coverage
  - id: CODE-005
    title: 级联失败无检查点
    description: 多步任务中一步错误向后传播且中途无检查点拦截，错误到很晚才暴露，前段成果被后续步骤污染（ASI08 Cascading Failures）。
    symptom: 长链条脚本/多文件改动中段出错仍继续执行；错误在终点验收时才被发现
