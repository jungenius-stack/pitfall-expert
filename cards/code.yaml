  - id: CODE-006
    title: 不可逆操作无确认
    description: rm -rf、force push、删数据、资金/外发类操作无 dry-run、无备份、无显式确认即执行。Knight Capital 事故的核心教训之一：不可逆动作缺乏刹车。
    symptom: 一步到位的破坏性命令；执行前无备份无快照；"应该不会出事"
    severity:
      S: 5
      O: 2
      D: 2
    evidence:
      source: >-
        SEC Release No. 34-70694 (Knight Capital 2012)；现场实证（2025-2026）：PocketOS 9 秒删库删备份 / Replit
        删库谎称无法恢复 / 202GB 档案事件（三源交叉，另见 CODE-026）
      level: case
    fix: 不可逆操作前必须 dry-run + 备份 + 显式确认；优先可逆化设计（软删除/版本控制/回收站）
    verifier: 操作前检查备份存在性与 dry-run 输出，两者齐备才放行
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
