  - id: CODE-023
    title: 限流参数被静默忽略（设了但不起作用，且无任何征兆）
    description: >-
      客户端设置了生成长度上限参数（max_tokens / max_completion_tokens），网关接受该参数却不在生成时执行， 输出远超上限；且 finish_reason 返回
      stop 而非 length，HTTP 200，响应外观与正常完全一致， 客户端无法从响应察觉参数失效。代价：成本失控 + 长输出撑爆下游上下文。
    symptom: 设了极小的输出上限但实际输出远超；finish_reason 从不出现 length；成本高于预期
    severity:
      S: 8
      O: 5
      D: 9
    evidence:
      source: >-
        2026-10-15 实测（apiget / gpt-6-astra）：max_tokens=1 输出 2728 tok、max_tokens=50 输出 5421 tok （超设定
        108 倍）、max_tokens=200 输出 4816 tok；换用 max_completion_tokens=1/100 同样被忽略 （分别输出 3023 / 3152
        tok）。三次 finish_reason 均为 stop。同一参数在 OpenDesign 渠道 （deepseek-v4.1-flash）则正常生效——跨渠道行为不一致。
      level: case
    fix: >-
      对任何「限制类参数」做越界实测（设极小值 + 强制长输出任务），而非只测「能否接受该参数」； 把 finish_reason 纳入检查但不可单独作为证据（参数失效时它同样返回 stop）；
      控成本改用外部手段（计时/字符数/流式累加中止）；跨渠道必须分别实测，禁止外推。
    verifier: >-
      发 {"max_tokens":1,"messages":[{"role":"user","content":"写一篇 3000 字的文章，主题：雨夜。直接开始正文，不要停。"}]} →
      预期：若 usage.completion_tokens > 10 则命中本坑（本次实测值 2728）。
    confidence: backed_by_context
