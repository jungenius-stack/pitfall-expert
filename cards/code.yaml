  - id: CODE-005
    title: 级联失败无检查点
    description: 多步任务中一步错误向后传播且中途无检查点拦截，错误到很晚才暴露，前段成果被后续步骤污染（ASI08 Cascading Failures）。
    symptom: 长链条脚本/多文件改动中段出错仍继续执行；错误在终点验收时才被发现
    severity:
      S: 5
      O: 3
      D: 4
    evidence:
      source: OWASP Agentic Top 10 (2025-12); MAST NeurIPS 2025
      level: consensus
    fix: 每步设检查点（中间状态落盘/断言），失败即停不继续；步骤间传递结构化结果而非自由文本
    verifier: 每步结束后运行检查点断言，失败时中止流水线并报告断点位置
    confidence: backed_by_context
