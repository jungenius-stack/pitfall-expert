      level: consensus
    fix: 所有时间显式带时区，内部统一 UTC 存储；边界日期进测试集；日期运算用成熟库
    verifier: 边界日期测试套件：2/29、12/31 23:59:59、夏令时切换小时、跨时区往返转换
