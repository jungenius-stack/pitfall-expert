  - id: CODE-024
    title: 校验层限制与实际服务限制不一致（通过校验 ≠ 能跑）
    description: >-
      网关用「标称上下文」做前置参数校验，后端用「实际（更小）上下文」做服务限制，两个数字不同；
      且报错文本指向错误的对象，误导排查方向。表现为「参数校验通过但在服务端被拒」的错位。
    symptom: 某组合通过校验却被后端拒绝；报错把 A 参数的问题说成 B 参数过长
    severity:
      S: 6
      O: 2
      D: 9
    evidence:
      source: >-
        2026-10-15 实测（apiget / gpt-6-astra）：max_tokens=999990（prompt 仅 "hi"）HTTP 200 通过；
        max_tokens=1000000 被 400 拒绝，报错文本为 "prompt is too long: input exceeds the maximum context length"
        ——而该请求的 prompt 只有 2 个字符。同时真实 prompt 上限实测为 872000
        （服务端原文 "876739 tokens > 872000 maximum context length"）。
        推断：网关按标称 1M 校验 prompt+max_tokens，后端按 872K 限制实际 prompt。
      level: case
    fix: >-
      上下文与输出参数一律以「实测能跑通的最大值」为准，不采信校验通过；
      配置值向下取整留余量；遇到「prompt too long」类报错先核对报错指向的参数是否与实际超限参数一致。
    verifier: >-
      分别发 max_tokens=999990 与 max_tokens=1000000（prompt 固定为 "hi"）
      → 预期：前者 200、后者 400（即复现校验边界）。再发一个 880K token 的 prompt
      → 预期 400 且报错文本含 872000。
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
