  - id: CODE-009
    title: 时区与日期边界
    description: 时区/夏令时/本地化日期/2 月 29 日/Unix 2038 等"程序员相信的谎言"。无时区声明的时间戳转换是最常见的数据正确性坑。
    symptom: 时间转换无时区声明；月末/年末/闰年/夏令时切换小时未测；日期比较用字符串
    severity:
