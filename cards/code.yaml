  - id: CODE-017
    title: await 无响应承诺（协议通知）
    description: >-
      对 JSON-RPC 通知（有 method 无 id 的消息，如 notifications/initialized）await 响应——协议规定通知不得回复，Promise
      悬挂直到超时。在测试里表现为神秘的超时失败，根因与服务器无关。
    symptom: await 一个"应该马上返回"的协议调用却超时；被 await 的消息没有 id 字段；服务器日志显示从未收到该请求的响应义务
    severity:
      S: 3
      O: 3
      D: 4
    evidence:
      source: pitfall-expert 项目 P2 实测（2026-10-14，node:test + MCP stdio，15s 超时后定位）; JSON-RPC 2.0 规范（通知不得响应）
      level: case
    fix: 严格区分请求（有 id，等响应）与通知（无 id，只发送）；通知走 fire-and-forget，不进 await 链；协议封装层对无 id 消息直接拒绝 await
