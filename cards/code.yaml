  - id: CODE-007
    title: 死代码/遗留配置重新激活
    description: >-
      无人引用的旧代码路径、feature flag、配置项被新变更重新激活。Knight Capital：一个遗留部署 flag 被激活，45 分钟损失 4.4 亿美元。Hyrum
      定律的镜像——你以为无人依赖的行为，有人暗中依赖。
    symptom: 变更触及"看似无关"的共享配置/flag；上线行为与本地不一致；没人说得清某配置的确切用途
    severity:
      S: 5
      O: 2
      D: 5
    evidence:
      source: SEC Release No. 34-70694; Hyrum's Law
      level: case
    fix: 改共享配置/flag 前全仓 grep 引用；看不懂用途的先考古再动（切斯特顿栅栏）；拆除代码保持观察期
    verifier: 变更前输出全仓引用 grep 报告并逐条确认；关键变更灰度验证生产行为
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
