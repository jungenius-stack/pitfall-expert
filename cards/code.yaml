  - id: CODE-002
    title: 幻觉式完成
    description: 宣称任务完成但环境状态未变或不符合预期——文件不存在/内容为空/数据库值未更新/外部系统无预期响应。MAST 将其归为"未经验证的终止"。
    symptom: 出现"已完成""应该可以了"类陈述但无状态证据；输出物缺失或内容不符
    severity:
      S: 5
      O: 3
      D: 3
    evidence:
      source: >-
        MAST, Cemri et al., NeurIPS 2025 (arXiv:2503.13657); τ-bench ICLR 2025；IEEE
        Spectrum（2026-01，B 级转述研究）：新一代模型静默失败上升——代码能跑、错误更隐蔽、更难调试
      level: empirical
    fix: 完成声明必须附环境状态证据：文件存在性+内容抽样、数据库查询结果、外部 API 响应；无证据的完成声明不予采信
    verifier: 任务结束后运行状态断言脚本，逐项比对"预期状态 vs 实际状态"，输出差异清单
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 任务收尾
      - 已完成类声明
      - 交付物生成
      - 多步长任务终点
      - task complete
      - done statement
      - delivery claim
      - finished
  - id: CODE-003
    title: 复跑不一致（方差陷阱）
    description: 单次成功掩盖高方差——同一任务多次运行结果漂移。τ-bench 实测：SOTA function-calling agent 单次成功率约 60%，八次全对（pass^8）低于 25%。
    symptom: 将"刚才明明可以"当作稳定性证据；一次性 demo 通过即宣告可靠
    severity:
      S: 4
      O: 4
      D: 4
    evidence:
      source: τ-bench, Yao et al., ICLR 2025 (arXiv:2406.12045)
      level: empirical
    fix: 关键任务设计复跑比对（≥3 次），报告一致性与方差而非单次结果；不可复跑任务显式声明为不可验证项
    verifier: 同输入连跑 N 次，对输出做结构化 diff 比对，统计一致率
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
