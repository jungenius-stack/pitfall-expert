  - id: CODE-016
    title: shell 变量展开被全角字符截断
    description: >-
      bash/sh 中 $VAR 后紧跟全角字符（如全角括号）时，本机 locale 下全角字符的字节会被并进变量名，导致 set -u 报 unbound
      variable（变量未绑定）错误——且错误信息里的变量名尾部带乱码字节，极具迷惑性，实际变量已正确赋值。
    symptom: set -u 脚本报某变量 unbound 但该变量明明已赋值；错误信息中变量名后有怪异字节；赋值行与使用行之间只差一个全角符号
    severity:
      S: 3
      O: 3
      D: 5
    evidence:
      source: pitfall-expert 项目 P3 实测（2026-10-14，macOS /bin/sh，连踩 3 处后修复）
      level: case
    fix: $VAR 后紧跟非 ASCII 字符时改用 ${VAR} 花括号定界；中文提示语里的变量引用一律写 ${VAR}
    verifier: grep 自查正则：\$[A-Za-z_][A-Za-z0-9_]*[^ -~]（$ 后变量名紧跟非 ASCII 可见字符即为嫌疑）；或 shellcheck 扫描 + set -u 实跑
    confidence: backed_by_context
    pass_k_relevant: false
