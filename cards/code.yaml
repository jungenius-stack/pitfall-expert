  - id: CODE-018
    title: 跳过规则先于阻断规则（白名单旁路）
    description: >-
      门控/过滤逻辑中，跳过（白名单/琐碎）规则若先于阻断（黑名单/高危）规则求值，高危输入会被静默放过。实测案例：git push --force 因首词 git
      命中琐碎命令表，在破坏性检查执行前就被返回"跳过"——黑名单测试全过，真实高危输入却毫无记录。
