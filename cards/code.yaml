      level: case
    fix: 改共享配置/flag 前全仓 grep 引用；看不懂用途的先考古再动（切斯特顿栅栏）；拆除代码保持观察期
    verifier: 变更前输出全仓引用 grep 报告并逐条确认；关键变更灰度验证生产行为
