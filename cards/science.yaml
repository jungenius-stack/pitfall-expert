  - id: SCI-006
    title: LLM 直接给事实一致性打分，与人类标注无显著相关
    description: "GPT-4 与 PaLM-2 直接为摘要的事实一致性打分时，分数与人类标注无显著相关。事实性判断应转为 QA 分解或可验证检查，而不是整体印象打分。"
    symptom: 用 AI 给「内容是否属实/与原文是否一致」整体打分并采信；事实核查环节没有可追溯的逐条比对
    severity:
      S: 6
      O: 6
      D: 7
    evidence:
      source: "Are Large Language Models Reliable Judges?（CoRR 2023，aminer.cn/pub/65430613939a5f40829d369d）"
      level: empirical
    fix: 事实性结论改为逐条二元分解——把声明拆成可独立核实的最小命题（CheckEval 式），每条对照来源核对，不做整体印象分
    verifier: 抽 3 条「AI 判为一致」的声明人工对照原文——任一条实为不一致即本坑命中
