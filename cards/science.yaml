  - id: SCI-009
    title: 统计检验选错但算得无懈可击（适用性错误：「正确执行的错误检验」）
    description: "LLM 的统计错误结构与人类互补：模型主要犯适用性错误——检验前提不满足仍套用（非独立样本用独立 t 检验、忽略多重比较），人类主要犯任务混淆错误（StatQA, NeurIPS 2024 D&B，11,623 例，GPT-4o 最好约 64.83%——bib 作者全，数字待补验）。最险处：选错口径后的执行流程（公式、代码、p 值）往往完全正确——一个「算得无懈可击的错误检验」。教科书式简单 vignette 上选对率高（Mondal 2024，旁证），制造「方法选择已可靠」的错觉，但复测信度不稳（Bard 重测相关 r=-0.22）。"
    symptom: 让模型「跑个显著性检验」并直接采用其检验选型；无人核对检验前提（独立性/分布/方差齐性/多重比较）；看到 p 值与代码就放行
    severity:
      S: 7
      O: 6
      D: 7
    evidence:
      source: >-
        StatQA / Are Large Language Models Good Statisticians?（NeurIPS 2024 D&B, Zhu et al. HKUST，bib 全、数字待补验）+
        Mondal et al. Perspect Clin Res 2024（bib 在，未直达旁证）
      level: empirical
    fix: "模型先输出适用性 checklist（独立性/分布/方差齐性/多重比较/单双侧）再选检验，缺项打回；重要分析用第二个（异源）模型独立选型，分歧即人审"
    verifier: "让模型回答「该检验的三个前提是什么、本数据是否满足」——答不出前提、或答出但不对照本数据即命中"
    confidence: needs_verification
    pass_k_relevant: false
    triggers:
      - 跑个回归
      - 显著性检验
      - 用什么检验
      - 卡方
      - t检验
      - anova
      - 多重比较校正
      - statistical test
      - which test
      - significance testing
    hazard_type: 常见错误
    source_ref: AMiner定量报告四.1节-2026-10-17
  - id: SCI-010
    title: 统计方法名说对了、命令参数是错的（概念性失配改变结论）
    description: "32 个统计例题上模型检验识别全对，但生成的 Stata 命令中最高 12.5% 是会改变结论的概念性失配（CMM），集中在 Friedman 检验、重复测量 ANOVA、典型相关、因子分析（Sebo & Wang, Intern Emerg Med 2026，PubMed 41746546 实名验真，数字为正文级）。人类复核看到「方法名说对了」就放行，不再逐参数核对——方法名正确掩盖参数层错误。与 SCI-009 分层：那张是选型层，这张是执行层。"
    symptom: 模型说「用 XX 检验」正确，生成的命令/代码直接复制运行；无人逐参数对照官方文档；复现时才发现结果口径不对
    severity:
      S: 6
      O: 6
      D: 7
    evidence:
      source: >-
        Sebo & Wang, Internal and Emergency Medicine 2026（PubMed 41746546 实名验真；识别 100%/命令 87.5–96.9%/CMM
        12.5% 为报告转述正文级）
      level: empirical
    fix: "统计命令先在已知答案的合成数据上 dry-run（验证统计性质再上真实数据）；对照 R/Stata 官方文档逐参数 diff；两个模型交叉生成命令比对分歧点"
    verifier: "任取一条模型生成的统计命令，在均值为零的合成数据上跑——报出「显著」即命中（命令层有错）；逐参数对照官方文档有一处语义不符即命中"
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - stata命令
      - r代码跑统计
      - spss
      - 给我分析命令
      - statsmodels
      - stata command
