  - id: SCI-008
    title: 图表与问题矛盾时不拒答（幻觉值量纲格式全对，置信无差别）
    description: "图表与问题矛盾（信息缺失/冲突）条件下模型几乎不拒绝作答：GPT-5 仅 34.46%、o4-mini 22.79%（ChartHal, arXiv:2509.17481，1,062 样本，直达验真——摘要明确「涉及图中缺失或矛盾信息的问题特别容易触发幻觉」）；SOTA 在上下文与问题矛盾时同样难以拒答（FaithEval, ICLR 2025，旁证）。幻觉数值在量纲、数量级、格式上与真值分布一致，错误应答与正确应答的置信度无差别。"
    symptom: 问「图里 X 是多少」而图中没有 X，模型照样给出确定数字；错误答案与正确答案措辞同样自信；无人做过「不存在值」探测
    severity:
      S: 6
      O: 7
      D: 7
    evidence:
      source: >-
        ChartHal（arXiv:2509.17481，直达验真：1,062 样本/GPT-5 34.46%/o4-mini 22.79% 原句在摘要；「多数开源 0%」为正文级）+
        FaithEval（ICLR 2025，未直达旁证：unanswerable/inconsistent/counterfactual 三类上下文仍作答）+ FAITH（ACM ICAIF 2025，bib 在）
      level: empirical
    fix: "动手前做掩码回填抽检（遮住 N 个已知单元格/图上锚点让模型补全，对不上即弃用该数据通道）；要求模型先复述表/图骨架（行列数+表头/轴范围）再答题——骨架复述错即停"
    verifier: "混入一个「表中/图中不存在」的提问——模型给出确定数值即命中（预期多数命中）；掩码回填 3 个单元格任一不符即该模型对该数据源弃用"
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
