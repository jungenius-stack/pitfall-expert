cards:
  - id: SCI-001
    title: 训练/测试数据泄漏（验证分数虚高，部署后才崩）
    description: >-
      模型在训练时用到了预测时不可能有的信息：全量数据上 fit 预处理再切分（imputation/scaling/特征选择泄漏）、 目标泄漏（特征里藏着 y
      的代理）、测试集混入训练。验证分数高得可疑，部署后性能跳水； 学术场景更狠——泄漏 bug 曾使一批已发表论文的结论翻转。AI 生成 ML 代码时此坑高发：默认流程不含 split
      顺序审计。
    symptom: 验证/CV 分数好到不信（AUC 0.99 类）；历史数据回测优秀、新数据拉胯；预处理（fit/transform）发生在 train/test 切分之前； 特征与目标相关性异常高
    severity:
      S: 9
      O: 4
      D: 8
    evidence:
      source: >-
        PMC（Rosenblatt et al. 2023，empirical）：连接组 ML 中测试数据泄漏使 train/test 切分失效、相关系列研究结论需翻转； Kaggle
        经典教程（Alexis Cook，train/test 污染 + 目标泄漏两类，consensus）； Daily Dose of
        DS：泄漏常在部署后才被发现——历史数据表现好得可疑正是信号
      level: empirical
    fix: 先切分后 fit：任何在全量数据上拟合的步骤（插补/缩放/特征选择/过采样）全部重做到训练折内； 逐特征问「预测时刻这个值拿得到吗」；时序数据按时间切分不随机切
    verifier: 打乱目标 y 重训一次（y=shuffle）——分数应跌回随机水平，仍然高 = 有泄漏； 分数超过领域常识上限（如结构化数据 AUC>0.95）触发人工审计
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
