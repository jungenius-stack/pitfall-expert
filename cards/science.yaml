  - id: SCI-011
    title: 图表推理性问答接近半错（解释头头是道、数值取错；有错不降置信）
    description: "真实学术图表上描述性问题尚可（约 80%），推理性问题 GPT-4o 仅 47.1%、人类 80.5%、最强开源 29.2%（CharXiv, NeurIPS 2024 D&B, 2,323 张真实 arXiv 图，直达验真）。模型视觉内容已理解仍答错（CVPR 2025 注意力研究，旁证）——「解释说得头头是道、数值取错」。含错/误导图表是放大器：模型不会因图有错而降低置信（ChartHal 验真部分），误导读图（倒置轴等）连人带模型一起骗（CHARTOM，旁证）。〔注：报告引「ChartMistake 55% vs 91%」的编号经查为另一篇论文，数字弃用。〕"
    symptom: 让模型看图给结论并直接引用数值；无人抽查图上锚点值；对「图本身可能有错/误导性」零设防
    severity:
      S: 6
      O: 7
      D: 6
    evidence:
      source: >-
        CharXiv（arXiv:2406.18521, NeurIPS 2024 D&B，直达验真：2,323 图/47.1%/人类 80.5% 原句在摘要）+ Unveiling
        the Ignorance of MLLMs（arXiv:2406.10638, CVPR 2025，未直达旁证：视觉内容已理解仍答错）+ CHARTOM（arXiv:2408.14419，未直达旁证）
      level: empirical
    fix: "先 chart-to-table：模型先输出结构化数据表，人工/代码抽查 3–5 个锚点值，全对才准做推理；关键结论做区域级追问（「该值对应哪个轴哪个点」）；对来源不明的图表先查误导性（轴截断/倒置）"
    verifier: "抽 3 个锚点值人工读图核对——任一错即命中（图表理解层不可信，全部数值转人工核对）；同图改配色/加噪重问一次，答案漂移即弃用"
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
