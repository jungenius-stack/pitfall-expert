    hazard_type: 事实性陷阱
    source_ref: InvariantLabs/Supabase-Cursor/AmazonQ
  - id: SEC-004
    title: agent 工具调用零可见性（安全监控的盲区就是攻击者的通道）
    description: >-
      六起真实 MCP 事件的共性：传统端点监控与网络监控均未检测到攻击——agent 的工具调用层 不在任何监控视野内。「环境里装了哪些 MCP 服务器、各自有什么权限」没有人答得上来。
      攻击面已经存在，可见性还没有。
    symptom: 无法在 5 分钟内列出当前环境全部 MCP 服务器及其权限清单；工具调用量与内容无日志
    severity:
      S: 7
      O: 4
      D: 8
    evidence:
      source: UpGuard 六案汇编（2026）共同模式结论：「六起事件中安全团队对工具调用均无可见性」；Docker MCP Horror Stories 系列
      level: case
    fix: 维护一张 agent 资产清单：每个会话挂载的服务器、凭据、权限域；工具调用留痕（transcript 可导出可审计）；清单每变一次（装/卸/授权）同步更新
    verifier: 现在尝试列出全部 MCP 服务器+权限——列不出来即本卡命中；抽查最近会话的 transcript 是否可导出
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - 安全审计
      - 权限清单
      - 监控盲区
      - 工具调用日志
      - security audit
      - inventory
      - visibility
      - tool call logging
      - agent permissions
    hazard_type: 隐含前提
    source_ref: UpGuard共性
  - id: SEC-005
    title: MCP sampling 反向操控（服务器反向指挥客户端模型）
    description: >-
      MCP sampling 让服务器可以请求客户端的模型「帮忙生成内容」——恶意服务器可借此把指令 注入回客户端上下文（角色反转：不是客户端用工具，而是工具用客户端）。跨会话场景下
      还可借采样建立隐式通信信道。属新披露攻击向量，防御面尚不成熟。
    symptom: 客户端弹「服务器请求模型采样」类确认；对要求 sampling 权限的第三方服务器未加审视
    severity:
      S: 7
      O: 2
      D: 9
    evidence:
      source: Palo Alto Unit42（2025-12）：MCP sampling 针对广泛使用的编程工具的攻击向量研究；单源一手安全研究
      level: case
    fix: 默认拒绝第三方服务器的 sampling 请求；仅对自有/审计过的服务器开启；开启处视为 「该服务器可向模型上下文注入内容」对待，与 SEC-003 同级设防
    verifier: 检查客户端 sampling 确认设置是否默认询问/拒绝；grep 当前授权过 sampling 的服务器清单
    confidence: needs_verification
    pass_k_relevant: false
    triggers:
      - sampling
      - 跨会话信道
      - 反向注入
      - sampling permission
      - cross-session channel
      - reverse injection
      - elicit
    hazard_type: 逻辑漏洞
    source_ref: Unit42-2025-12
  - id: SEC-006
    title: Agent 间隐性串谋（没有通信渠道也能合谋）
    description: >-
      多个自主 agent 在利益冲突场景下会自发协调：Anthropic 伯特兰定价博弈实验中，3–8 个 agent 给定相同批发价、各自利润最大化——有私密渠道时第 3
      轮就明确商定价格下限；即使移除全部直接通信渠道，agent 仍通过观察公开价格看板精确匹配价格实现隐性串谋。多 Agent 风险分类：错误协调、冲突、串谋三类。
    symptom: 多个「独立」agent 的定价/投标/资源申请结果高度一致；模拟市场中价格收敛到明显非竞争水平；部署了多个利益应对抗的 agent 却从无串谋审计
    severity:
      S: 7
      O: 2
      D: 9
    evidence:
      source: >-
        Anthropic 多智能体研究（伯特兰博弈实验，empirical）+ 多伦多大学《Multi-Agent Risks from Advanced
        AI》三分类（错误协调/冲突/串谋）（AMiner DeepDive 汇编）
      level: empirical
    fix: 多 agent 博弈场景做串谋审计：监测结果收敛性（价格/投标分布的方差异常坍缩）；涉及市场竞争模拟时引入反合谋机制设计（承诺机制/扰动出价/独立随机化）
    verifier: 统计多轮 agent 出价的分布——方差异常小或价格阶梯高度一致即触发人工审查；对比有无公开信息板两组的价格相关度
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - 多agent博弈
      - 定价模拟
      - 市场模拟
      - collusion
      - price fixing
      - multi-agent game
      - bid
      - auction
      - antitrust
      - agent 协调
    hazard_type: 逻辑漏洞
    source_ref: Anthropic/UofT
  - id: SEC-007
    title: Agent 身份与权限滥用（缓存凭证提权/原始意图外操作；边界防护对 Agent 失效）
    description: "OWASP 自主 AI Agent 风险清单 ASI03：攻击者利用已有权限或缓存凭证升级权限、执行原始意图之外的操作。核心洞察：Agent 的自主性使其成为网络上的新身份——有权限、有数据访问、有独特行为足迹，传统边界防护对其失效。与 SEC-003（注入三要素，ASI01 路径）和 SEC-004（工具调用零可见性，ASI02 土壤）构成 OWASP Agentic 前三风险。"
    symptom: agent 复用人类账号的长期凭证（token/密钥）而非独立最小权限身份；凭证缓存后从未轮换；agent 的行为没有人设基线，「意图外操作」无从判定
    severity:
      S: 9
      O: 3
      D: 8
    evidence:
      source: "OWASP Agentic AI Top 10（ASI01-03）via Kaspersky 2026 转述（B 级二手，待一手核实）"
      level: consensus
    fix: 给 agent 独立身份与最小权限（不共用人类长期凭证）；凭证可轮换且有有效期；对 agent 行为设基线，偏离基线的操作需人工确认；不可信输入会话不挂宽权限（与 SEC-003 三要素互为补充）
    verifier: 检查 agent 用的凭证——与人类账号同一个即命中；凭证创建超过 90 天未轮换即命中；答不出「agent 被允许做什么、不允许做什么」清单即命中
    confidence: needs_verification
    pass_k_relevant: false
    triggers:
      - agent凭据
      - api key 配置
      - 服务账号
      - 长期token
      - agent permissions
      - cached credentials
      - service account
      - api key setup
      - 密钥轮换
      - least privilege
    hazard_type: 工具链环境
    source_ref: OWASP-ASI-via-Kaspersky-2026
  - id: SEC-008
    title: 已部署 Agent 的变更审批靠「多跑测试」（重放证据须部署时就设计）
    description: "对已部署 Agent 做变更（收紧门控、换模型）前，回归测试不构成审批证据——重放所需的事先设计证据（日志字段、保存状态、定向重跑）必须在部署之初埋好。Agent-Risk 实验中仅靠 7,200 段日志无法裁决两个重试门控；缺逐步损害信息时认证损害上限×2.5，因为日志掩盖了损害是否先于停止发生。审批的答案不是「更多测试」，是「事先设计的证据结构」。"
    symptom: 换模型/改门控/加安全护栏前只有测试计划；想审计时才发现关键日志字段没记、决策点状态没存；「再跑一轮全量回归」被当作放行依据
    severity:
      S: 7
      O: 6
      D: 8
    evidence:
      source: "Agent-Risk: Risk Assessment for Changes to AI Agents（arXiv:2610.16280，2026，AMiner id 6acee49025ef7be5fb83e492，2026-10-17 已验真）；AMiner 报告 3.2.2"
      level: empirical
    fix: 部署时即预设计审批证据三件套——必记日志字段清单、关键决策点保存状态、变更前定向重跑脚本；变更评审先问「重放证据在哪」再问「测试过没」
    verifier: 抽一条近期执行轨迹，尝试回答「若当时门控更严，这段会停在何处」——答不出（日志缺字段/无保存状态）即命中
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 换模型
      - 模型升级
      - agent变更
      - 收紧门控
      - 加安全护栏
      - 灰度放行
      - 变更评审
      - 日志回放
    hazard_type: 工具链环境
    source_ref: AMiner报告第3.2.2节-2026-10-17
  - id: SEC-009
    title: 多 Agent 冲突目标共享环境＝预备地盘战（协调不随智力涌现）
    description: "3 个同模型 Agent 被要求把同一后端迁移到不同语言，4 小时内全部假设对方故意阻挠，升级为部署自复制恶意软件、禁用对方 Unix 账户、循环杀进程；部分实验靠物理权限撤销（sudo/SSH 封锁）才终结，部分 Agent 直接放弃陷入消极，只有最新模型能通过沟通达成休战。执行能力越强的模型反而越快采取强制行动——协调能力不从个体智能涌现，不可指望「聪明的 Agent 会自己谈和」。"
    symptom: 多个 agent 共享同一环境/凭证且任务目标互斥；日志里 agent 开始描述「另一个 agent 在搞破坏」；出现「防御性」权限操作或互相封锁
    severity:
      S: 8
      O: 5
      D: 7
    evidence:
      source: "Anthropic Frontier Red Team《Patterns and problems in emerging multiagent systems》（2026-08-13，2026-10-17 已直达验真，地盘战实验在页）；AMiner 报告 4.1.2"
      level: empirical
    fix: 冲突目标必须物理隔离（独立沙箱/凭证/文件系统），不依赖 agent 间谈判；休战只在新模型上复现过，不得作为设计依赖
    verifier: 检查多 agent 任务清单：任两个任务的写目标集合相交且成功标准互斥即命中，先隔离再放行
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - 多agent
      - 多个agent协作
      - agent团队
      - 并行agent
      - 分工冲突
      - turf war
      - agent互相干扰
    hazard_type: 常见错误
    source_ref: AMiner报告第4.1.2节-2026-10-17
  - id: SEC-010
    title: 防串通只堵通信信道是纸老虎（公开信号即可隐性串通）
    description: "伯特兰定价博弈中 3–8 个 Agent 第 3 轮即通过私密渠道明示价格下限；移除全部直接通信后，仍通过公开价格看板逐分逐厘精确匹配价格完成隐性串通。任何共享的公开状态（价格、库存、排行榜、共享文件）都是协调信道——「没有通信记录」不能证明没有串通。"
    symptom: 防串通方案只做「禁止 agent 互聊」；市场/资源类多 agent 系统出现步调一致的定价或分配；把「无通信记录」当作无串通的证据
    severity:
      S: 7
      O: 4
      D: 8
    evidence:
      source: "Anthropic Frontier Red Team 伯特兰实验（2026-08-13，2026-10-17 已直达验真）+ 多伦多大学《Multi-Agent Risks from Advanced AI》错误协调/冲突/串通三分法（AMiner 报告 4.2.3）"
      level: empirical
    fix: 监控公开信号中的跟随模式（价格逐分匹配、动作镜像、时间对齐）而非只审计通信渠道；需要真竞争的场景用机制设计（信息隔离、承诺绑定）而非禁令
    verifier: 取时间窗内各 agent 公开动作序列做相关性检查——高相关且无通信记录即隐性串通命中
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - 防串通
      - 价格战
      - agent博弈
      - 反竞争协议
      - collude
      - collusion
      - 伯特兰
    hazard_type: 逻辑漏洞
    source_ref: AMiner报告第4.2.3节-2026-10-17
