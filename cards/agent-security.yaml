      - 全部允许
    hazard_type: 隐含前提
    source_ref: AliceWarningland-USENIX13/Egelman-CHI08/Ancker-BMC17
  - id: SEC-012
    title: 「它自己知道危险」不是防线（说得出来≠拦得住）
    description: "LM agent 可以具备准确的风险知识、能复述某操作的危险性，但执行时仍不据此行动（COLM 2025 实证）。与幻觉式完成（CODE-002）互补的镜像：不是不知道危险，是知道也不拦自己。含义：「它自己会判断」「系统提示里写了注意安全」「先自评安全性再执行」都不构成控制层。"
    symptom: 靠系统提示写「注意安全/危险操作先确认」当防线；让模型自评「这个操作安全吗」后按自评执行；「它这么聪明肯定知道什么不该做」
    severity:
      S: 7
      O: 6
      D: 8
    evidence:
      source: "Tang & Li, LM Agents May Fail to Act on Their Own Risk Knowledge（COLM 2025，arXiv:2508.13465，直达验真）"
      level: empirical
    fix: 控制层外置到确定性层——权限白名单/hooks 拦截/最小权限；自评结论只作参考维度；危险操作判定用规则（命令模式/路径/资源类型），不靠自觉
    verifier: 构造模型能正确说出风险的危险调用场景（如让它在带危险参数的 rm/deploy 上自评后再执行）——仍执行即命中（预期：会执行）
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 模型会注意
      - 它自己知道
      - 模型自评
      - 自检安全
      - safe mode
      - self-check
      - 它不会乱来
      - 让模型判断危险
    hazard_type: 隐含前提
    source_ref: TangLi-COLM25/arXiv2508.13465
