      - collusion
      - collude
      - price fixing
      - multi-agent game
      - bid
      - auction
      - antitrust
      - agent 协调
      - 伯特兰
    hazard_type: 逻辑漏洞
    source_ref: Anthropic/UofT（原 SEC-010 并入）
  - id: SEC-007
    title: Agent 身份与权限滥用（缓存凭证提权/原始意图外操作；边界防护对 Agent 失效）
    description: "OWASP 自主 AI Agent 风险清单 ASI03：攻击者利用已有权限或缓存凭证升级权限、执行原始意图之外的操作。核心洞察：Agent 的自主性使其成为网络上的新身份——有权限、有数据访问、有独特行为足迹，传统边界防护对其失效。与 SEC-003（注入三要素，ASI01 路径）和 SEC-004（工具调用零可见性，ASI02 土壤）构成 OWASP Agentic 前三风险。"
    symptom: agent 复用人类账号的长期凭证（token/密钥）而非独立最小权限身份；凭证缓存后从未轮换；agent 的行为没有人设基线，「意图外操作」无从判定
    severity:
      S: 9
      O: 3
      D: 8
    evidence:
      source: "OWASP Top 10 for Agentic Applications 2026 官方（genai.owasp.org 资源页 2025-12-09 直达；crosswalk 仓库 GenAI-Security-Project/crosswalk 的 Agentic_AITG.md，文件存在性经 GitHub API 核实）：ASI03 Identity & Privilege Abuse（Critical）——agents 继承并缓存凭据、攻击者借之横向移动、测试须覆盖凭据泄漏全路径与凭据作用域访问控制（crosswalk 原句未逐字复核）——原 Kaspersky B 级转述 2026-10-26 替换为官方一手"
      level: consensus
    fix: 给 agent 独立身份与最小权限（不共用人类长期凭证）；凭证可轮换且有有效期；对 agent 行为设基线，偏离基线的操作需人工确认；不可信输入会话不挂宽权限（与 SEC-003 三要素互为补充）
    verifier: 检查 agent 用的凭证——与人类账号同一个即命中；凭证创建超过 90 天未轮换即命中；答不出「agent 被允许做什么、不允许做什么」清单即命中
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - agent凭据
      - api key 配置
      - 服务账号
      - 长期token
      - agent permissions
      - cached credentials
      - service account
      - api key setup
      - 密钥轮换
      - least privilege
    hazard_type: 工具链环境
    source_ref: OWASP-ASI-via-Kaspersky-2026
  - id: SEC-008
    title: 已部署 Agent 的变更审批靠「多跑测试」（重放证据须部署时就设计）
    description: "对已部署 Agent 做变更（收紧门控、换模型）前，回归测试不构成审批证据——重放所需的事先设计证据（日志字段、保存状态、定向重跑）必须在部署之初埋好。Agent-Risk 实验中仅靠 7,200 段日志无法裁决两个重试门控；缺逐步损害信息时认证损害上限×2.5，因为日志掩盖了损害是否先于停止发生。审批的答案不是「更多测试」，是「事先设计的证据结构」。"
    symptom: 换模型/改门控/加安全护栏前只有测试计划；想审计时才发现关键日志字段没记、决策点状态没存；「再跑一轮全量回归」被当作放行依据
    severity:
      S: 7
      O: 6
      D: 8
    evidence:
      source: "Agent-Risk: Risk Assessment for Changes to AI Agents（arXiv:2610.16280，2026，AMiner id 6acee49025ef7be5fb83e492，2026-10-17 已验真）；AMiner 报告 3.2.2"
      level: empirical
    fix: 部署时即预设计审批证据三件套——必记日志字段清单、关键决策点保存状态、变更前定向重跑脚本；变更评审先问「重放证据在哪」再问「测试过没」
    verifier: 抽一条近期执行轨迹，尝试回答「若当时门控更严，这段会停在何处」——答不出（日志缺字段/无保存状态）即命中
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
