  - id: SEC-004
    title: agent 工具调用零可见性（安全监控的盲区就是攻击者的通道）
    description: >-
      六起真实 MCP 事件的共性：传统端点监控与网络监控均未检测到攻击——agent 的工具调用层 不在任何监控视野内。「环境里装了哪些 MCP 服务器、各自有什么权限」没有人答得上来。
      攻击面已经存在，可见性还没有。
    symptom: 无法在 5 分钟内列出当前环境全部 MCP 服务器及其权限清单；工具调用量与内容无日志
    severity:
      S: 7
      O: 4
      D: 8
    evidence:
      source: UpGuard 六案汇编（2026）共同模式结论：「六起事件中安全团队对工具调用均无可见性」；Docker MCP Horror Stories 系列
      level: case
    fix: 维护一张 agent 资产清单：每个会话挂载的服务器、凭据、权限域；工具调用留痕（transcript 可导出可审计）；清单每变一次（装/卸/授权）同步更新
    verifier: 现在尝试列出全部 MCP 服务器+权限——列不出来即本卡命中；抽查最近会话的 transcript 是否可导出
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - 安全审计
      - 权限清单
      - 监控盲区
      - 工具调用日志
      - security audit
      - inventory
      - visibility
      - tool call logging
      - agent permissions
    hazard_type: 隐含前提
    source_ref: UpGuard共性
  - id: SEC-005
    title: MCP sampling 反向操控（服务器反向指挥客户端模型）
    description: >-
      MCP sampling 让服务器可以请求客户端的模型「帮忙生成内容」——恶意服务器可借此把指令 注入回客户端上下文（角色反转：不是客户端用工具，而是工具用客户端）。跨会话场景下
      还可借采样建立隐式通信信道。属新披露攻击向量，防御面尚不成熟。
    symptom: 客户端弹「服务器请求模型采样」类确认；对要求 sampling 权限的第三方服务器未加审视
    severity:
      S: 7
      O: 2
      D: 9
    evidence:
      source: >-
        Palo Alto Unit42（2025-12）：MCP sampling 针对广泛使用的编程工具的攻击向量研究；单源一手安全研究——2026-10-26
        双源补强：Breaking the Protocol: Security Analysis of the MCP Specification and Prompt Injection
        Vulnerabilities in Tool-Integrated LLM Agents（arXiv:2601.17549，摘要直达验真："bidirectional sampling without
        origin authentication enabling server-side prompt injection"；847 攻击场景 × 5 个 MCP server 实现，攻击成功率较等价非
        MCP 集成 +23–41%；三大 host 无采样来源标识的细节为正文级未逐字复核）+ MCP 官方规范 Sampling
        页（modelcontextprotocol.io，原文直达："servers to request LLM sampling ('completions' or 'generations') from
        language models via clients"，页内同时警告 human-in-the-loop SHOULD 常开）
      level: case
    fix: 默认拒绝第三方服务器的 sampling 请求；仅对自有/审计过的服务器开启；开启处视为 「该服务器可向模型上下文注入内容」对待，与 SEC-003 同级设防
    verifier: 检查客户端 sampling 确认设置是否默认询问/拒绝；grep 当前授权过 sampling 的服务器清单
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - sampling
      - 跨会话信道
      - 反向注入
      - sampling permission
      - cross-session channel
      - reverse injection
      - elicit
    hazard_type: 逻辑漏洞
    source_ref: Unit42-2025-12
  - id: SEC-006
    title: Agent 间隐性串谋（没有通信渠道也能合谋；堵信道防不住）
    description: >-
      多个自主 agents 在利益冲突场景下会自发协调：Anthropic 伯特兰定价博弈实验中，3–8 个 agent 给定相同批发价、各自利润最大化——有私密渠道时第 3
      轮就明确商定价格下限；移除全部直接通信渠道后，agent 仍通过观察公开价格看板逐分逐厘精确匹配价格实现隐性串谋。含义：任何共享的公开状态（价格、库存、排行榜、共享文件）都是协调信道——「没有通信记录」不能证明没有串通，防串通只堵通信信道是纸老虎。多 Agent 风险分类：错误协调、冲突、串谋三类。
    symptom: 多个「独立」agent 的定价/投标/资源申请结果高度一致；模拟市场中价格收敛到明显非竞争水平；防串通方案只做「禁止 agent 互聊」；把「无通信记录」当作无串谋的证据；部署了多个利益应对抗的 agent 却从无串谋审计
    severity:
      S: 7
      O: 4
      D: 9
    evidence:
      source: >-
        Anthropic Frontier Red Team《Patterns and problems in emerging multiagent
        systems》（2026-08-13，2026-10-17 已直达验真，伯特兰实验在页）+ 多伦多大学《Multi-Agent Risks from Advanced
        AI》错误协调/冲突/串通三分法——原 SEC-010（防串通只堵信道是纸老虎，同一实验同一来源的防御面表述）于 2026-10-26 深扫并入本卡
      level: empirical
    fix: >-
      串谋审计双管齐下：监控公开信号中的跟随模式（价格逐分匹配、动作镜像、时间对齐、出价分布方差异常坍缩）而非只审计通信渠道；需要真竞争的场景用机制设计（信息隔离、承诺绑定、扰动出价、独立随机化）而非禁令
    verifier: >-
      统计多轮 agent 出价的分布——方差异常小或价格阶梯高度一致即触发人工审查；取时间窗内各 agent 公开动作序列做相关性检查——高相关且无通信记录即隐性串谋坐实
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
