  - id: SEC-011
    title: 审批/警告弹窗习惯化盲批（约三次暴露后依从显著衰减）
    description: "2520 万次警告曝光遥测：用户无视 Chrome SSL 警告比例 70.2%，且点击率随暴露次数单调上升（21%→30%→37%，第一至第三次），对最常见警告类型点击得更快——习惯化在神经层面（fMRI 重复抑制）与行为层面都成立。呈现强度是头号决定因素：主动阻断式警告 79% 听从，被动提示仅 1/60 理会。落到 agent 场景：权限弹窗/approval 提示一路秒批、「always allow」点到底，第 N 次审批时内容根本没被读——「有提示」不等于「提示被消费」。"
    symptom: 权限/审批弹窗秒批；一路点「允许/always allow」；审批延迟越来越短；弹窗内容变了（更危险的操作）批准行为不变
    severity:
      S: 7
      O: 7
      D: 8
    evidence:
      source: "Akhawe & Felt, Alice in Warningland（USENIX Security 2013，25.2M 曝光遥测，usenix.org 直达验真）；Egelman et al., You've Been Warned（CHI 2008，DOI:10.1145/1357054.1357219，主动阻断 79% vs 被动提示 1/60）；Ancker et al.（BMC Med Inform 2017，DOI:10.1186/s12911-017-0430-8，每次既往暴露都提高忽视率）"
      level: empirical
    fix: 高危操作用主动阻断式提示（强制停顿+具体后果描述）；常规操作分诊降级压弹窗总量（警告频率本身是变量）；审批类工具检查「批准延迟随序号单调下降」的习惯化信号
    verifier: 抽取审批日志算批准延迟对审批序号的斜率——延迟单调下降即命中；或故意夹入一个明显危险的请求，被秒批即命中
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
