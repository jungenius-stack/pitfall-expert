  - id: CRT-005
    title: 长篇结构与计划失守（大纲漂移、结局仓促、节奏失控）
    description: "长文生成中全局规划能力不足：写着写着偏离大纲、前松后紧导致结局仓促收束、支线失控吞掉主线。长篇叙事生成研究（推理式生成管线、叙事状态扩展）的动机正是：直接生成在 10K+ 词尺度上结构质量崩坏，需要显式规划与状态维护机制——裸生成不具备。"
    symptom: 成品与大纲结构对不上；最后 1/5 篇幅 rushed；支线喧宾夺主；章节比例失衡（前 80% 慢后 20% 快）
    severity:
      S: 5
      O: 7
      D: 6
    evidence:
      source: "Learning to Reason for Long-Form Story Generation（arXiv:2503.22828，Gurung et al. 2025）；Scaling Long-Form Story Generation via Narrative State（arXiv:2609.35759）"
      level: empirical
    fix: 大纲细化到章级带字数配额；分章生成+每章完成后对照大纲勾验；预留结局篇幅硬约束（如最后 15% 只写收束）；结构核对进交付前检查单
    verifier: 章节字数/情节点对照大纲逐项核——偏离配额 >30% 或大纲条目缺失即命中
    confidence: backed_by_context
    pass_k_relevant: false
    triggers:
      - 分章写
      - 全书结构
      - 章节大纲
      - 结局
      - 节奏
      - story structure
      - pacing
      - ending
      - plot outline
      - multi-chapter
      - 写一个系列
    hazard_type: 常见错误
    source_ref: ReasonLongForm2025/NarrativeState2026
  - id: CRT-006
    title: 集体脑暴同质化（每人想法更多，但全员想法趋同；责任感同步下降）
    description: "「一枚硬币的两面」：接触 GenAI 故事想法使个体作品更有创意（增益集中于低创造力者），但 AI 组作品彼此相似度显著更高（Science Advances 2024）；ChatGPT 用户每人产出更多更详细的想法（自我感觉更有创造力），但不同用户之间想法语义区分度显著下降、对想法的责任感降低（C&C 2024，36 人对照）。机制：与对齐后模型共写才同质化，基座 GPT-3 无此效应——效应来自模型贡献文本的单一化（ICLR 2024）；规模化证据：3 项预注册研究 2200 篇大学文书，每篇新增人类文书贡献的新想法多于 AI 文书，且 prompt/参数修改无法弥补（CHB:AI Humans 2025）。落到使用侧：团队全员 AI 脑暴 = 每人更快、集体更笨——「想法数量变多」掩盖「组间多样性坍缩」。"
    symptom: 团队用 AI 脑暴后方案明显趋同；「每人想法变多了」被当成果汇报；没人做过组间重叠度检查；AI 辅助产出的想法责任感/所有权讨论变少
    severity:
      S: 4
      O: 7
      D: 7
    evidence:
      source: "Doshi & Hauser, Science Advances 2024（DOI:10.1126/sciadv.adn5290）；Anderson et al., C&C 2024（DOI:10.1145/3635636.3656204）；Padmakumar & He, ICLR 2024（arXiv:2309.05196）；Moon et al., CHB: Artificial Humans 2025（DOI:10.1016/j.chbah.2025.100207，3 项预注册/2200 篇）——全部 2026-10-24 直达验真"
      level: empirical
    fix: 关键脑暴分两轨——AI 轨 + 独立人轨（禁 AI），汇总先做组间重叠度对比再合并；AI 产出的想法显式标注来源，去重后再计数；重要创意决策不只用「想法数量」做 KPI
    verifier: 对 AI 辅助组与独立组的产出做词面/语义重叠分析——AI 组组间相似度显著高于独立组基线即命中
    confidence: backed_by_context
    pass_k_relevant: false
