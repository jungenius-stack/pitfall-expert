  - id: CRT-004
    title: 主观/创作维度是 AI 评委最弱区（跨裁判一致性显著低于技术类）
    description: "GraderAssist 多裁判实证：技术类标准（对错可查）的裁判一致性显著强于论证类/主观类任务；创作质量恰落在最弱区。叠加 LLM 评委已知偏差（偏爱长文、偏爱 LLM 生成文本、正面偏差抓不出坏答案），用 AI 给创作打分/选优的结论噪声极大——「AI 说这段写得好」接近无信息。"
    symptom: 用 AI 给多个版本打分选优；用「AI 觉得哪个好」决定文风/标题/情节走向；多版本 AI 评分差异微小却据此定稿
    severity:
      S: 5
      O: 7
      D: 7
    evidence:
      source: "Chakrabarty et al., Art or Artifice?（CHI 2024，arXiv:2309.14556，直达验真：专业作家 TTCW 测试下 LLM 故事仅通过人类故事的 1/3–1/10 测试项，且没有任何 LLM 评估器与专家评分正相关）；CoBBLEr（ACL 2024，arXiv:2309.17012，直达验真：15 个 LLM 评估器平均 40% 两两比较带认知偏差、人机偏好重合 RBO 仅 49.6%）；Kim et al., Can LLMs Be Good Evaluators in Creative Writing Tasks?（MDPI Applied Sciences 2025）；GraderAssist（Informatics 2025，主观维度一致性弱）；结合 RD-013/RD-014 通用裁判偏差"
      level: empirical
    fix: 创作质量判定以目标读者样本/人工盲评为准；AI 评审仅用于可核对维度（一致性/字数/设定符合度——CRT-001 类客观检查）；多版本选优用位置平衡+异源双评，分歧即弃判
    verifier: 同批作品交换呈现顺序让 AI 重选一次——选择翻转即本坑命中（与 RD-015 验证器同构）
    confidence: backed_by_context
    pass_k_relevant: false
