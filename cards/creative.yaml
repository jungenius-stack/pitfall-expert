      - 前后一致
    hazard_type: 常见错误
    source_ref: ConStoryBench-2026/NarrativeState-2026
  - id: CRT-002
    title: 长上下文中段遗忘（设定埋在中段=等于没写）
    description: "Lost in the Middle 实证：长上下文里模型对中段信息的利用显著弱于首尾。写作场景的具体化：大纲第 3 条设定、中段埋的伏笔、章节中段的关键约束最容易被忽略——不是模型没读到，是读到也没用上。以为「已经写进上下文了」不等于「会被遵守」。"
    symptom: 明明贴了大纲/设定全文，生成结果仍违反其中中段条目；中段伏笔无回收；约束清单靠前靠后条目被遵守、中间条目被跳过
    severity:
      S: 5
      O: 7
      D: 7
    evidence:
      source: "Liu et al., Lost in the Middle（TACL 2024，arXiv:2307.03172）；EQ-Bench 长篇创作评测（质量维持随长度衰减）"
      level: empirical
    fix: 关键设定放上下文首尾并重复出现；生成后对照约束清单逐条勾验，缺项重生成该段；约束超过 ~10 条时分批处理
    verifier: 把 10 条编号约束埋入中段后生成，逐条核对输出——中段条目（4–7 号）违例率显著高于首尾即命中
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 大纲
      - 设定集
      - 约束清单
      - 按要求写
      - 伏笔
      - outline
      - constraints
      - writing prompt
      - follow the brief
      - story bible
    hazard_type: 隐含前提
    source_ref: LostInMiddle-TACL2024
  - id: CRT-003
    title: 风格趋同与 AI 味（slop：模板化表达、节奏单一、形容词堆砌）
    description: "AI 长文输出的风格收敛：高频套路句式（「不是……而是……」「仿佛整个世界都……」类）、节奏均匀无张弛、辞藻堆砌而细节稀薄、不同题材读起来像同一个人写的。跨模型横向对比（EQ-Bench 系）显示风格区分度远低于人类作者分布；社区已形成 slop 检测清单（低Distinctiveness词表）。对「要写出个人风格/特定文风」的任务是直接失败。"
    symptom: 指定文风仿写但成品一眼 AI 味；多个不同题材产出风格雷同；细节密度低、修辞密度高；去 AI 味提示词治标不治本
    severity:
      S: 4
      O: 8
      D: 5
    evidence:
      source: "Doshi & Hauser, Science Advances 2024（DOI:10.1126/sciadv.adn5290，AI 组作品彼此相似度显著更高）；Anderson et al., C&C 2024（DOI:10.1145/3635636.3656204，组间语义区分度下降）；Padmakumar & He, ICLR 2024（arXiv:2309.05196，机制：与对齐模型共写才同质化、基座 GPT-3 无此效应）；Mohammadi 2024（arXiv:2406.05587，上游机制：RLHF 降低句法/语义多样性）；EQ-Bench 长篇榜 + 社区 slop 词表（呈现层佐证）——前四项 2026-10-24 直达验真"
      level: empirical
    fix: 提供目标文风的实文样本（few-shot 锚定，远胜形容词描述）；生成后跑 slop 词表抽检并要求重写命中段落；接受「AI 味无法归零只能压低」的现实，关键作品人工润色
    verifier: 对成品跑高频 AI 套路句式清单（≥20 条）grep 计数——命中密度高于阈值（如每千字 ≥3 处）即命中
    confidence: backed_by_context
    pass_k_relevant: false
