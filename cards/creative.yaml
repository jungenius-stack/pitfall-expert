  - id: CRT-001
    title: 长篇一致性漂移（角色/设定/事实前后矛盾）
    description: "LLM 写长文时无法稳定维持既定事实：角色性格漂移、设定自相矛盾、前文细节（物品/时间线/称谓）被遗忘或改写。ConStory-Bench（2000 条提示）系统记录了数千到十万词尺度上叙事一致性的崩坏；随篇幅增长一致性单调劣化。AI 生成时「每一段都通顺」掩盖了跨段矛盾——读者第十章才发现第五章的伏笔被吃掉。"
    symptom: 续写/扩写任务中角色突然变了性格或知识；设定（规则/地理/时间线）前后冲突；早期伏笔无回收或被 contradictory 改写
    severity:
      S: 6
      O: 8
      D: 6
    evidence:
      source: "Consistency Bugs in Long Story Generation by LLMs（ConStory-Bench，arXiv:2603.05890，2026）；Scaling Long-Form Story Generation via Narrative State（arXiv:2609.35759：1万–10万词一致性随长度劣化）"
      level: empirical
    fix: 显式维护「设定状态表」（角色/事实/伏笔三清单）并随写随更；分章生成时每章开头喂状态表而非依赖上下文记忆；交付前跑一致性核对（见 verifier）
    verifier: 抽取全文实体清单（人名/物品/时间），逐实体 grep 前后文出现处，人工比对属性是否一致——任一实体两种说法即命中
    confidence: backed_by_context
    pass_k_relevant: true
    triggers:
      - 续写
      - 改写
      - 长篇小说
      - 世界观设定
