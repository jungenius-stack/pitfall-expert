  - id: MATH-015
    title: 混合记法/单位换算的数量级错位（内部知道、说出来就错）
    description: "SOTA 模型在混合记法比较上系统性出错（5.7×10 的 2 次方与 580 谁大；EACL 2026, arXiv:2602.07812 直达验真）——且隐藏层线性探针能恢复正确 log-magnitude（探针排序 90%+ vs 模型显式排序仅 50–70%）：内部知道、表达出来就错，所以输出毫无犹豫信号。基础数字处理基准上「9.11 大于 9.9」类错误系统性出现（NUPA, ICLR 2025 直达验真）；仪器读数上「读对数、挂错单位」是独立失败通道（MeasureBench 旁证）；实测医疗剂量建议在无患者变量时过半不正确（van Nuland, EJCP 2024，PubMed 38592470 验真）。换算系数错一位在最终数字上无任何语法异常，下游只会怀疑「算错」不会怀疑「记法读错」。"
    symptom: 混合记法（科学计数法/万进制/百分比）直接交给模型比较或换算；换算系数没人单独核对；下游只查「数字像不像」不查量纲
    severity:
      S: 7
      O: 7
      D: 7
    evidence:
      source: >-
        LLMs Know More About Numbers than They Can Say（EACL 2026, arXiv:2602.07812，直达验真：混合记法错误与线性探针恢复
        log-magnitude 在摘要）+ NUPA/Number Cookbook（ICLR 2025, arXiv:2411.03766，直达验真：9.11 vs 9.9 在摘要；记法崩塌为正文级）+
