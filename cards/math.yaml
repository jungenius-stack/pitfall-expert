  - id: MATH-014
    title: 多步任务超过推理断点后「格式正确的错误答案」（推理模型也崩溃）
    description: "可控谜题环境三段式：任务规模小时标准 LLM 反而胜过推理模型；中等规模推理模型占优；超过阈值后准确率完全崩溃（complete accuracy collapse），推理 token 数不升反降（提前放弃），给显式算法也无法遵循（The Illusion of Thinking, arXiv:2506.06941, NeurIPS 2025，摘要直达验真）。最险处：崩溃前后的输出风格无差异——错误以格式工整的错误答案出现，无任何犹豫信号。"
    symptom: 多步推理任务直接交给模型并采信输出；没做任务规模爬坡找断点；输出格式工整/推理链流畅就默认结论可靠
    severity:
      S: 6
      O: 6
      D: 8
    evidence:
      source: >-
        The Illusion of Thinking（arXiv:2506.06941, Apple, NeurIPS 2025；2026-10-17 直达验真：collapse/effort 先升后降/fail
        to use explicit algorithms 原句在摘要）+ Knowing When to Quit（ACL 2026 Findings, arXiv:2607.29211，未直达旁证：能力外任务产出表面有效的
        specious reasoning）
      level: empirical
    fix: "多步任务动手前做任务规模爬坡预检（同一任务族逐步加大子问题数），找出该模型断点；实际任务落在断点 70% 以上区域的一律换方法（分解/工具化）并强制人审"
    verifier: "把任务按子问题数拆 3 档各测一次——高档准确率相对中档跳水即命中，按断点以下流程处理该任务族"
    confidence: backed_by_context
    pass_k_relevant: true
