  - id: MATH-013
    title: 多位运算中间数位崩塌（首末位对、中间 1–2 位错）
    description: "Transformer 把多位乘除拆成并行逐位子任务，进位链与中间结果缓存是瓶颈（Dissecting Multiplication, arXiv:2407.15360 直达验真：修补后 5 位乘法 99.9%）；多位乘法中间数位准确率骤降（正文级口径：首末位 >95%、中间数位约 10%）。答案两端正确、仅中间 1–2 位错——尾数首数都对时人工复核最容易放过；且模型在推理链中自主定位错误步骤的能力有限（Tyen, ACL 2024 旁证）——「让它自己检查一遍」不可靠。"
    symptom: 让模型心算多位数乘除/百分比并直接采信；答案与真值只差中间一两位；复核只核尾数或首数
    severity:
      S: 6
      O: 7
      D: 7
    evidence:
      source: >-
        Dissecting Multiplication in Transformers（arXiv:2407.15360，2026-10-17 直达验真：逐位并行子任务+进位/中间结果缓存瓶颈在摘要；中间位
        U 型为正文级）+ Language Models are Symbolic Learners in Arithmetic（arXiv:2410.15580，未直达旁证）+ Tyen et al. ACL 2024（arXiv:2311.08516
        未逐字，旁证：LLM 自主定位 CoT 错误步骤能力有限）
      level: empirical
    fix: "3 位及以上数字的乘除/幂一律外化到代码或解释器；人工抽查用逐位比对，禁止只比终值或只看尾数"
    verifier: "任取一次模型心算的多位数结果逐位比对——中间位错而首末位对即命中；或 20 题 4–6 位乘法探针，逐位错误率超 5% 即该模型禁用心算输出"
    confidence: backed_by_context
    pass_k_relevant: false
